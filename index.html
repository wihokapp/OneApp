<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WIHOK ONE APP</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WIHOK ONE APP">
<style>
  :root {
    --bg: #0f172a;
    --bg2: #1e293b;
    --fg: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --danger: #f87171;
    --card: rgba(255,255,255,.06);
    --line: rgba(255,255,255,.12);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #1e3a5f 0%, var(--bg) 60%);
    color: var(--fg);
    font-family: -apple-system, "Sukhumvit Set", "Noto Sans Thai", "Segoe UI", Roboto, sans-serif;
  }
  button, input { font: inherit; color: inherit; }

  /* ---------- Home ---------- */
  #home {
    position: fixed; inset: 0;
    padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 24px);
    overflow-y: auto;
    transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s;
  }
  body.in-app #home { transform: scale(.94); opacity: 0; pointer-events: none; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .topbar h1 { font-size: 22px; margin: 0; font-weight: 700; }
  .topbar small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; margin-top: 2px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; border: 0;
    background: var(--card); display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn svg { width: 20px; height: 20px; stroke: var(--fg); fill: none; stroke-width: 2; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    gap: 22px 12px;
    max-width: 720px; margin: 0 auto;
  }
  .app {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: none; border: 0; padding: 0; cursor: pointer;
  }
  .app .tile {
    width: 64px; height: 64px; border-radius: 18px;
    display: grid; place-items: center; font-size: 32px; overflow: hidden;
    box-shadow: 0 6px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .15s;
  }
  .app:active .tile { transform: scale(.9); }
  .app .tile img { width: 100%; height: 100%; object-fit: cover; }
  .app .label {
    font-size: 12px; line-height: 1.3; text-align: center; max-width: 80px;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .empty { text-align: center; color: var(--muted); margin-top: 18vh; line-height: 1.7; }
  .status { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }

  /* ---------- App view ---------- */
  #appview {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  body.in-app #appview { transform: none; }
  .appbar {
    display: flex; align-items: center; gap: 8px;
    padding: calc(var(--safe-top) + 6px) 8px 6px;
    background: var(--bg2); border-bottom: 1px solid var(--line);
  }
  .appbar .title { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appbar .icon-btn { background: transparent; }
  #frames { position: relative; flex: 1; background: #fff; }
  #frames iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    visibility: hidden;
  }
  #frames iframe.active { visibility: visible; }
  .loader {
    position: absolute; inset: 0; display: none; place-items: center;
    background: var(--bg); color: var(--muted); font-size: 14px;
  }
  .loader.show { display: grid; }
  .spinner {
    width: 32px; height: 32px; border-radius: 50%; margin: 0 auto 12px;
    border: 3px solid var(--line); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Sheets / dialogs ---------- */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: flex-end; justify-content: center; z-index: 20;
  }
  .sheet-backdrop.show { display: flex; }
  .sheet {
    width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
    background: var(--bg2); border-radius: 20px 20px 0 0;
    padding: 20px 16px calc(var(--safe-bottom) + 20px);
    animation: up .3s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet h2 { margin: 0 0 4px; font-size: 18px; }
  .sheet p.hint { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .field input {
    width: 100%; padding: 11px 12px; border-radius: 10px;
    background: var(--bg); border: 1px solid var(--line); outline: none; font-size: 16px;
  }
  .field input:focus { border-color: var(--accent); }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }
  .field input[type=color] { padding: 4px; height: 44px; }
  .btn {
    border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer;
    background: var(--card); font-weight: 600;
  }
  .btn.primary { background: var(--accent); color: #082f49; }
  .btn.danger { background: transparent; color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .msg { font-size: 13px; color: var(--danger); min-height: 18px; margin-top: 6px; }

  .dev-list { list-style: none; margin: 0 0 12px; padding: 0; }
  .dev-list li {
    display: flex; align-items: center; gap: 10px;
    padding: 10px; border-radius: 12px; background: var(--card); margin-bottom: 8px;
  }
  .dev-list .tile { width: 40px; height: 40px; border-radius: 11px; font-size: 20px; flex: none;
    display: grid; place-items: center; overflow: hidden; }
  .dev-list .tile img { width: 100%; height: 100%; object-fit: cover; }
  .dev-list .info { flex: 1; min-width: 0; }
  .dev-list .info b { display: block; font-size: 14px; }
  .dev-list .info span { display: block; font-size: 11px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev-list .mini { width: 32px; height: 32px; border-radius: 9px; border: 0;
    background: transparent; cursor: pointer; display: grid; place-items: center; }
  .dev-list .mini svg { width: 16px; height: 16px; stroke: var(--fg); fill: none; stroke-width: 2; }
  .dev-list .mini:disabled { opacity: .25; }
  .preview-tile { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 14px;
    display: grid; place-items: center; font-size: 32px; overflow: hidden; }
  .preview-tile img { width: 100%; height: 100%; object-fit: cover; }

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 24px);
    transform: translateX(-50%) translateY(20px); opacity: 0;
    background: #f1f5f9; color: #0f172a; padding: 10px 16px; border-radius: 999px;
    font-size: 14px; transition: .25s; z-index: 50; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>

<!-- ===== หน้ารวมไอคอน ===== -->
<main id="home">
  <div class="topbar">
    <h1>WIHOK ONE APP<small id="subtitle">แตะเพื่อเปิดใช้งาน</small></h1>
    <button class="icon-btn" id="devBtn" aria-label="โหมดผู้พัฒนา">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="status" id="status"></div>
</main>

<!-- ===== หน้าแอป (iframe) ===== -->
<section id="appview" aria-hidden="true">
  <div class="appbar">
    <button class="icon-btn" id="backBtn" aria-label="กลับ">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="title" id="appTitle"></div>
    <button class="icon-btn" id="reloadBtn" aria-label="โหลดใหม่">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
  <div id="frames">
    <div class="loader" id="loader"><div><div class="spinner"></div>กำลังโหลด…</div></div>
  </div>
</section>

<!-- ===== ใส่ PIN ===== -->
<div class="sheet-backdrop" id="pinSheet">
  <form class="sheet" id="pinForm" autocomplete="off">
    <h2>โหมดผู้พัฒนา</h2>
    <p class="hint">ใส่ PIN เพื่อจัดการรายการแอป</p>
    <div class="field">
      <input type="password" id="pinInput" inputmode="numeric" placeholder="PIN" required>
    </div>
    <div class="msg" id="pinMsg"></div>
    <div class="actions">
      <button type="button" class="btn" data-close>ยกเลิก</button>
      <button type="submit" class="btn primary" id="pinOk">เข้าสู่ระบบ</button>
    </div>
  </form>
</div>

<!-- ===== แผงจัดการแอป ===== -->
<div class="sheet-backdrop" id="devSheet">
  <div class="sheet">
    <h2>จัดการแอป</h2>
    <p class="hint">เพิ่ม แก้ไข ลบ หรือเรียงลำดับ แล้วกด “บันทึก” ผู้ใช้ทุกคนจะเห็นรายการใหม่</p>
    <ul class="dev-list" id="devList"></ul>
    <button class="btn" id="addBtn" style="width:100%">+ เพิ่มแอปใหม่</button>
    <div class="msg" id="devMsg"></div>
    <div class="actions">
      <button class="btn" id="devClose">ปิด</button>
      <button class="btn primary" id="saveBtn">บันทึก</button>
    </div>
  </div>
</div>

<!-- ===== ฟอร์มเพิ่ม/แก้ไขแอป ===== -->
<div class="sheet-backdrop" id="editSheet">
  <form class="sheet" id="editForm" autocomplete="off">
    <h2 id="editTitle">เพิ่มแอป</h2>
    <p class="hint">URL ต้องเป็นลิงก์ Web App ที่ลงท้ายด้วย /exec</p>
    <div class="preview-tile" id="preview"></div>
    <div class="field">
      <label>ชื่อแอป</label>
      <input id="fName" maxlength="30" required placeholder="เช่น ลงเวลาทำงาน">
    </div>
    <div class="field">
      <label>URL ของ Apps Script</label>
      <input id="fUrl" type="url" required placeholder="https://script.google.com/macros/s/…/exec">
    </div>
    <div class="row">
      <div class="field">
        <label>ไอคอน (อีโมจิ หรือ URL รูป)</label>
        <input id="fIcon" placeholder="📋">
      </div>
      <div class="field" style="flex:0 0 80px">
        <label>สีพื้น</label>
        <input id="fColor" type="color" value="#2563eb">
      </div>
    </div>
    <div class="msg" id="editMsg"></div>
    <div class="actions">
      <button type="button" class="btn danger" id="delBtn">ลบ</button>
      <span style="flex:1"></span>
      <button type="button" class="btn" data-close>ยกเลิก</button>
      <button type="submit" class="btn primary">ตกลง</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   ตั้งค่า: วาง URL ของ Apps Script ตัวกลาง (ไฟล์ backend/Code.gs) ตรงนี้
   ถ้าเว้นว่างไว้ ระบบจะทำงานแบบ "โหมดทดลอง" เก็บข้อมูลในเครื่องนี้เท่านั้น
   ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyV8qTjhvVedNVwfMh5ANeaDLGrro3YkvhV0OOnn8P9jRrOdzK1sHnYhQiZuq80sdZN2w/exec';

const CACHE_KEY = 'launcher.apps.v1';
const DEMO_PIN = '1234';
const SAMPLE_APPS = [
  { id: 'a1', name: 'ลงเวลา', url: 'https://script.google.com/macros/s/XXXX/exec', icon: '⏰', color: '#2563eb' },
  { id: 'a2', name: 'แจ้งซ่อม', url: 'https://script.google.com/macros/s/YYYY/exec', icon: '🛠️', color: '#ea580c' },
  { id: 'a3', name: 'สต็อกสินค้า', url: 'https://script.google.com/macros/s/ZZZZ/exec', icon: '📦', color: '#16a34a' },
];

const $ = (id) => document.getElementById(id);
let apps = [];
let draft = [];          // สำเนาที่กำลังแก้ในโหมดผู้พัฒนา
let devPin = null;       // เก็บในหน่วยความจำเท่านั้น ปิดหน้าแล้วหาย
let editingIndex = -1;
let currentAppId = null;
const frames = {};       // เก็บ iframe ที่เคยเปิด กลับมาเปิดซ้ำจะเร็ว

/* ---------- storage helpers ---------- */
function readCache() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY)) || null; } catch { return null; }
}
function writeCache(list) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(list)); } catch {}
}

/* ---------- API ---------- */
async function apiGet() {
  const res = await fetch(API_URL + '?t=' + Date.now());
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'โหลดไม่สำเร็จ');
  return data.apps;
}
async function apiPost(body) {
  // ใช้ text/plain เพื่อไม่ให้เบราว์เซอร์ส่ง CORS preflight ซึ่ง Apps Script ไม่รองรับ
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'เกิดข้อผิดพลาด');
  return data;
}

/* ---------- rendering ---------- */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function tileInner(app) {
  const icon = (app.icon || '').trim();
  if (/^https?:\/\//i.test(icon)) return `<img src="${esc(icon)}" alt="" loading="lazy">`;
  return esc(icon || (app.name || '?').trim().charAt(0));
}
function renderGrid() {
  const grid = $('grid');
  if (!apps.length) {
    grid.innerHTML = '';
    $('status').innerHTML = '<div class="empty">ยังไม่มีแอป<br>กดปุ่มฟันเฟืองด้านบนเพื่อเพิ่ม</div>';
    return;
  }
  grid.innerHTML = apps.map(a => `
    <button class="app" data-id="${esc(a.id)}">
      <div class="tile" style="background:${esc(a.color || '#2563eb')}">${tileInner(a)}</div>
      <div class="label">${esc(a.name)}</div>
    </button>`).join('');
}
function setStatus(text) { $('status').textContent = text; }

function toast(text) {
  const t = $('toast');
  t.textContent = text; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- load ---------- */
async function load() {
  const cached = readCache();
  apps = cached || (API_URL ? [] : SAMPLE_APPS);
  renderGrid();
  if (!API_URL) { setStatus('โหมดทดลอง: ยังไม่ได้ตั้งค่า API_URL (PIN ทดลองคือ 1234)'); routeFromHash(); return; }
  if (!cached) setStatus('กำลังโหลด…');
  try {
    apps = await apiGet();
    writeCache(apps);
    renderGrid();
    if (apps.length) setStatus('');
  } catch (e) {
    setStatus(cached ? 'ออฟไลน์: แสดงรายการล่าสุดที่บันทึกไว้' : 'โหลดรายการแอปไม่สำเร็จ ลองใหม่อีกครั้ง');
  }
  routeFromHash();
}

/* ---------- open / close app ---------- */
function openApp(id, push = true) {
  const app = apps.find(a => a.id === id);
  if (!app) return;
  currentAppId = id;
  $('appTitle').textContent = app.name;

  let f = frames[id];
  if (!f || f.dataset.src !== app.url) {
    if (f) f.remove();
    f = document.createElement('iframe');
    f.dataset.src = app.url;
    f.allow = 'geolocation; camera; microphone; clipboard-write; fullscreen';
    f.addEventListener('load', () => { if (currentAppId === id) $('loader').classList.remove('show'); });
    $('loader').classList.add('show');
    f.src = app.url;
    $('frames').appendChild(f);
    frames[id] = f;
  } else {
    $('loader').classList.remove('show');
  }
  Object.values(frames).forEach(x => x.classList.toggle('active', x === f));

  document.body.classList.add('in-app');
  $('appview').setAttribute('aria-hidden', 'false');
  if (push) history.pushState({ app: id }, '', '#app=' + encodeURIComponent(id));
}
function closeApp() {
  currentAppId = null;
  document.body.classList.remove('in-app');
  $('appview').setAttribute('aria-hidden', 'true');
}
function routeFromHash() {
  const m = location.hash.match(/^#app=(.+)$/);
  if (m) openApp(decodeURIComponent(m[1]), false); else closeApp();
}

$('grid').addEventListener('click', e => {
  const b = e.target.closest('.app');
  if (b) openApp(b.dataset.id);
});
$('backBtn').addEventListener('click', () => {
  if (history.state && history.state.app) history.back();
  else { history.replaceState(null, '', location.pathname); closeApp(); }
});
$('reloadBtn').addEventListener('click', () => {
  const f = frames[currentAppId];
  if (f) { $('loader').classList.add('show'); f.src = f.dataset.src; }
});
window.addEventListener('popstate', routeFromHash);

/* ---------- sheets ---------- */
function showSheet(id) { $(id).classList.add('show'); }
function hideSheet(id) { $(id).classList.remove('show'); }
document.querySelectorAll('[data-close]').forEach(b =>
  b.addEventListener('click', () => hideSheet(b.closest('.sheet-backdrop').id)));
document.querySelectorAll('.sheet-backdrop').forEach(bd =>
  bd.addEventListener('click', e => { if (e.target === bd && bd.id !== 'devSheet') hideSheet(bd.id); }));

/* ---------- developer mode ---------- */
$('devBtn').addEventListener('click', () => {
  if (devPin) return openDev();
  $('pinInput').value = ''; $('pinMsg').textContent = '';
  showSheet('pinSheet');
  setTimeout(() => $('pinInput').focus(), 100);
});

$('pinForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pin = $('pinInput').value.trim();
  $('pinOk').disabled = true; $('pinMsg').textContent = '';
  try {
    if (API_URL) await apiPost({ action: 'verify', pin });
    else if (pin !== DEMO_PIN) throw new Error('PIN ไม่ถูกต้อง');
    devPin = pin;
    hideSheet('pinSheet');
    openDev();
  } catch (err) {
    $('pinMsg').textContent = err.message;
  } finally {
    $('pinOk').disabled = false;
  }
});

function openDev() {
  draft = apps.map(a => ({ ...a }));
  $('devMsg').textContent = '';
  renderDevList();
  showSheet('devSheet');
}
const ICON_UP = '<svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg>';
const ICON_DOWN = '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
const ICON_EDIT = '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
function renderDevList() {
  $('devList').innerHTML = draft.map((a, i) => `
    <li>
      <div class="tile" style="background:${esc(a.color)}">${tileInner(a)}</div>
      <div class="info"><b>${esc(a.name)}</b><span>${esc(a.url)}</span></div>
      <button class="mini" data-act="up" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="เลื่อนขึ้น">${ICON_UP}</button>
      <button class="mini" data-act="down" data-i="${i}" ${i === draft.length - 1 ? 'disabled' : ''} aria-label="เลื่อนลง">${ICON_DOWN}</button>
      <button class="mini" data-act="edit" data-i="${i}" aria-label="แก้ไข">${ICON_EDIT}</button>
    </li>`).join('') || '<li style="justify-content:center;color:var(--muted)">ยังไม่มีแอป</li>';
}
$('devList').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const i = +b.dataset.i;
  if (b.dataset.act === 'up' && i > 0) [draft[i - 1], draft[i]] = [draft[i], draft[i - 1]];
  if (b.dataset.act === 'down' && i < draft.length - 1) [draft[i + 1], draft[i]] = [draft[i], draft[i + 1]];
  if (b.dataset.act === 'edit') return openEdit(i);
  renderDevList();
});
$('devClose').addEventListener('click', () => hideSheet('devSheet'));
$('addBtn').addEventListener('click', () => openEdit(-1));

$('saveBtn').addEventListener('click', async () => {
  $('saveBtn').disabled = true; $('devMsg').textContent = '';
  try {
    if (API_URL) {
      const data = await apiPost({ action: 'save', pin: devPin, apps: draft });
      apps = data.apps;
    } else {
      apps = draft.map(a => ({ ...a }));
    }
    writeCache(apps);
    renderGrid();
    setStatus(API_URL ? '' : 'โหมดทดลอง: ยังไม่ได้ตั้งค่า API_URL (PIN ทดลองคือ 1234)');
    hideSheet('devSheet');
    toast('บันทึกแล้ว');
  } catch (err) {
    $('devMsg').textContent = err.message;
    if (/PIN/.test(err.message)) devPin = null;
  } finally {
    $('saveBtn').disabled = false;
  }
});

/* ---------- add / edit form ---------- */
function updatePreview() {
  const a = { name: $('fName').value, icon: $('fIcon').value, color: $('fColor').value };
  $('preview').style.background = a.color;
  $('preview').innerHTML = tileInner(a);
}
['fName', 'fIcon', 'fColor'].forEach(id => $(id).addEventListener('input', updatePreview));

function openEdit(i) {
  editingIndex = i;
  const a = i >= 0 ? draft[i] : { name: '', url: '', icon: '', color: '#2563eb' };
  $('editTitle').textContent = i >= 0 ? 'แก้ไขแอป' : 'เพิ่มแอป';
  $('fName').value = a.name; $('fUrl').value = a.url;
  $('fIcon').value = a.icon; $('fColor').value = a.color || '#2563eb';
  $('delBtn').style.display = i >= 0 ? '' : 'none';
  $('editMsg').textContent = '';
  updatePreview();
  showSheet('editSheet');
}
$('editForm').addEventListener('submit', e => {
  e.preventDefault();
  const url = $('fUrl').value.trim();
  if (!/^https:\/\//i.test(url)) { $('editMsg').textContent = 'URL ต้องขึ้นต้นด้วย https://'; return; }
  const item = {
    id: editingIndex >= 0 ? draft[editingIndex].id : 'a' + Date.now().toString(36),
    name: $('fName').value.trim(),
    url,
    icon: $('fIcon').value.trim(),
    color: $('fColor').value,
  };
  if (editingIndex >= 0) draft[editingIndex] = item; else draft.push(item);
  renderDevList();
  hideSheet('editSheet');
});
$('delBtn').addEventListener('click', () => {
  if (editingIndex < 0) return;
  if (!confirm('ลบ “' + draft[editingIndex].name + '” ?')) return;
  draft.splice(editingIndex, 1);
  renderDevList();
  hideSheet('editSheet');
});

/* ---------- PWA ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

load();
</script>
</body>
</html>
